<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF2BD6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-opacity="0.06"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1000" height="300" rx="18" fill="#0D1117"/>
  <rect width="1000" height="300" rx="18" fill="url(#grid)"/>
  <rect x="3" y="3" width="994" height="294" rx="16" fill="none" stroke="url(#border)" stroke-width="3"/>
  <circle cx="32" cy="28" r="7" fill="#FF2BD6"/>
  <circle cx="56" cy="28" r="7" fill="#FFD600"/>
  <circle cx="80" cy="28" r="7" fill="#39FF14"/>
  <text x="110" y="35" font-family="Orbitron, 'Courier New', monospace" font-size="17" font-weight="700" fill="#00E5FF" filter="url(#glow)">&gt; IDENTITY_CORE // ONLINE</text>
  <line x1="25" y1="52" x2="975" y2="52" stroke="#7C3AED" stroke-opacity="0.65"/>
  <g font-family="Orbitron, 'Courier New', monospace" font-size="18">
    <text x="45" y="90" fill="#00E5FF">name:</text>
    <text x="230" y="90" fill="#FFFFFF">Anna Svetlanova</text>
    <text x="45" y="125" fill="#00E5FF">role:</text>
    <text x="230" y="125" fill="#FFFFFF">Engenheira de Dados &amp; Software</text>
    <text x="45" y="160" fill="#00E5FF">position:</text>
    <text x="230" y="160" fill="#FF2BD6" filter="url(#glow)">COO</text>
    <text x="45" y="195" fill="#00E5FF">experience:</text>
    <text x="230" y="195" fill="#FFFFFF">12 anos</text>
    <text x="45" y="230" fill="#00E5FF">focus:</text>
    <text x="230" y="230" fill="#FFFFFF">dados confiáveis • sistemas seguros • soluções escaláveis</text>
    <text x="45" y="265" fill="#00E5FF">status:</text>
    <text x="230" y="265" fill="#39FF14" filter="url(#glow)">● ONLINE</text>
  </g>
</svg>
